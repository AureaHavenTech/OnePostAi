<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#12121a" />
  <title>One Post AI</title>
  <style>
    html, body { margin:0; height:100%; background:#12121a; color:#e8e0d4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      display:flex; align-items:center; justify-content:center; }
    .wrap { text-align:center; padding:24px; }
    .mark { font-size:56px; font-weight:800; color:#c9a96e; letter-spacing:-2px;
      font-family: Georgia, "Times New Roman", serif; }
    .sub { margin-top:12px; color:#e8e0d4; opacity:.85; font-size:15px; }
    .sub a { color:#c9a96e; }
  </style>
  <script>
    // One Post AI native shell loader.
    // The app is served by the Capacitor plugin `server.url` (hosted web app).
    // If the server.url is not yet active, fall back to opening the hosted app directly.
    setTimeout(function(){
      window.location.href = "https://onepostai.vercel.app";
    }, 800);
  </script>
</head>
<body>
  <div class="wrap">
    <div class="mark">One&nbsp;Post&nbsp;AI</div>
    <div class="sub"><a href="https://onepostai.vercel.app">Content that moves</a></div>
  </div>
</body>
</html>
