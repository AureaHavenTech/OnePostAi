<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="40%" stop-color="#d4b87a"/>
      <stop offset="60%" stop-color="#e8d4a0"/>
      <stop offset="100%" stop-color="#c9a96e"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#d4b87a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#1e1e2a" stroke-width="1.5"/>

  <!-- Box body -->
  <rect x="58" y="72" width="84" height="72" rx="4" stroke="url(#goldGrad)" stroke-width="2.5" fill="none"/>
  <!-- Box lid - lifted -->
  <path d="M52 72 L68 50 L132 50 L148 72" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <!-- Lid top line -->
  <line x1="58" y1="62" x2="142" y2="62" stroke="url(#goldGrad2)" stroke-width="1.5"/>

  <!-- Ribbon vertical -->
  <line x1="100" y1="50" x2="100" y2="144" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>
  <!-- Ribbon horizontal -->
  <line x1="58" y1="105" x2="142" y2="105" stroke="url(#goldGrad)" stroke-width="2" opacity="0.7"/>
  <!-- Bow -->
  <path d="M88 50 Q78 40 85 32 Q95 40 100 48 Q105 40 115 32 Q122 40 112 50" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Sparkles -->
  <g filter="url(#glow)" opacity="0.8">
    <circle cx="54" cy="58" r="2" fill="#e8d4a0"/>
    <circle cx="148" cy="55" r="1.5" fill="#e8d4a0"/>
    <circle cx="146" cy="70" r="2" fill="#e8d4a0"/>
    <circle cx="52" cy="75" r="1.5" fill="#d4b87a"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="100" cy="30" r="1.5" fill="#c9a96e" opacity="0.4"/>
  <circle cx="60" cy="42" r="1" fill="#c9a96e" opacity="0.3"/>
  <circle cx="140" cy="42" r="1" fill="#c9a96e" opacity="0.3"/>
</svg>