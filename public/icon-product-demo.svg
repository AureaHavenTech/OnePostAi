<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="40%" stop-color="#d4b87a"/>
      <stop offset="60%" stop-color="#e8d4a0"/>
      <stop offset="100%" stop-color="#c9a96e"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#e8d4a0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#1e1e2a" stroke-width="1.5"/>

  <!-- Spotlight beam -->
  <path d="M55 50 L145 50 L170 160 L30 160 Z" fill="url(#spotlight)" opacity="0.5"/>

  <!-- Product bottle -->
  <rect x="88" y="80" width="24" height="28" rx="3" stroke="url(#goldGrad)" stroke-width="2.5" fill="none"/>
  <rect x="92" y="70" width="16" height="14" rx="2" stroke="url(#goldGrad)" stroke-width="2" fill="none"/>
  <!-- Cap -->
  <rect x="95" y="64" width="10" height="8" rx="1" stroke="url(#goldGrad)" stroke-width="1.8" fill="none"/>
  <!-- Product label line -->
  <line x1="92" y1="92" x2="108" y2="92" stroke="#d4b87a" stroke-width="1" opacity="0.6"/>
  <line x1="94" y1="98" x2="106" y2="98" stroke="#d4b87a" stroke-width="0.8" opacity="0.4"/>

  <!-- Pedestal/Display stand -->
  <ellipse cx="100" cy="112" rx="22" ry="4" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>
  <line x1="78" y1="112" x2="72" y2="140" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="122" y1="112" x2="128" y2="140" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="100" cy="140" rx="32" ry="5" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>

  <!-- Spotlight top source -->
  <circle cx="100" cy="46" r="3" fill="#e8d4a0" filter="url(#glow)" opacity="0.8"/>
  <line x1="98" y1="49" x2="76" y2="66" stroke="#e8d4a0" stroke-width="0.5" opacity="0.3"/>
  <line x1="102" y1="49" x2="124" y2="66" stroke="#e8d4a0" stroke-width="0.5" opacity="0.3"/>

  <!-- Sparkles around product -->
  <g filter="url(#glow)" opacity="0.6">
    <circle cx="72" cy="82" r="1.5" fill="#e8d4a0"/>
    <circle cx="128" cy="86" r="1.5" fill="#d4b87a"/>
    <circle cx="75" cy="100" r="1" fill="#c9a96e"/>
  </g>

  <!-- Decorative dot -->
  <circle cx="100" cy="30" r="1.5" fill="#c9a96e" opacity="0.4"/>
</svg>