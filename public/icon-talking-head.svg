<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="40%" stop-color="#d4b87a"/>
      <stop offset="60%" stop-color="#e8d4a0"/>
      <stop offset="100%" stop-color="#c9a96e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#1e1e2a" stroke-width="1.5"/>

  <!-- Head silhouette -->
  <ellipse cx="100" cy="72" rx="30" ry="32" stroke="url(#goldGrad)" stroke-width="2.5" fill="none"/>
  <!-- Neck -->
  <line x1="90" y1="104" x2="88" y2="118" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="110" y1="104" x2="112" y2="118" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Shoulders -->
  <path d="M60 130 Q80 118 88 118" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M140 130 Q120 118 112 118" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="90" cy="72" rx="4" ry="3" stroke="#e8d4a0" stroke-width="1.5" fill="none"/>
  <ellipse cx="110" cy="72" rx="4" ry="3" stroke="#e8d4a0" stroke-width="1.5" fill="none"/>
  <!-- Mouth speaking -->
  <ellipse cx="100" cy="84" rx="7" ry="5" stroke="#d4b87a" stroke-width="1.5" fill="none"/>

  <!-- Speech bubble -->
  <g filter="url(#glow)" opacity="0.85">
    <path d="M50 38 Q50 22 68 22 L138 22 Q156 22 156 38 L156 58 Q156 74 138 74 L100 74 L80 92 L80 74 L68 74 Q50 74 50 58 Z" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <!-- Text lines in bubble -->
    <line x1="70" y1="38" x2="130" y2="38" stroke="#d4b87a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <line x1="70" y1="48" x2="115" y2="48" stroke="#d4b87a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <line x1="70" y1="58" x2="125" y2="58" stroke="#d4b87a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Decorative dot -->
  <circle cx="155" cy="40" r="1.5" fill="#c9a96e" opacity="0.4"/>
</svg>