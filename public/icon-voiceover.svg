<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="40%" stop-color="#d4b87a"/>
      <stop offset="60%" stop-color="#e8d4a0"/>
      <stop offset="100%" stop-color="#c9a96e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#1e1e2a" stroke-width="1.5"/>

  <!-- Mic body -->
  <rect x="90" y="80" width="20" height="36" rx="10" stroke="url(#goldGrad)" stroke-width="2.5" fill="none"/>
  <!-- Mic grill lines -->
  <line x1="94" y1="88" x2="106" y2="88" stroke="#d4b87a" stroke-width="1" opacity="0.6"/>
  <line x1="94" y1="93" x2="106" y2="93" stroke="#d4b87a" stroke-width="1" opacity="0.6"/>
  <line x1="94" y1="98" x2="106" y2="98" stroke="#d4b87a" stroke-width="1" opacity="0.6"/>

  <!-- Mic stand -->
  <line x1="100" y1="116" x2="100" y2="140" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M80 140 Q100 150 120 140" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Sound waves - left -->
  <g filter="url(#glow)" opacity="0.7">
    <path d="M62 70 Q50 85 50 100 Q50 115 62 130" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M52 60 Q35 80 35 100 Q35 120 52 140" stroke="#d4b87a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Sound waves - right -->
  <g filter="url(#glow)" opacity="0.7">
    <path d="M138 70 Q150 85 150 100 Q150 115 138 130" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
    </path>
    <path d="M148 60 Q165 80 165 100 Q165 120 148 140" stroke="#d4b87a" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite" begin="1s"/>
    </path>
  </g>

  <!-- Decorative dot -->
  <circle cx="100" cy="40" r="1.5" fill="#c9a96e" opacity="0.4"/>
</svg>