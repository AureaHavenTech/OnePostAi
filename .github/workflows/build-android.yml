name: Build One Post AI Android (Capacitor)

# Builds the native Android app in CI (cloud runner has JDK 17 + Android SDK,
# which this team's local machine does not). Produces a debug APK artifact.
#
# Manual trigger:  Actions -> "Build One Post AI Android" -> Run workflow
# Also runs on push to main and on the feature/capacitor-android branch.

on:
  workflow_dispatch:
  push:
    branches: [main, feature/capacitor-android]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies (incl. Capacitor)
        run: npm install

      - name: Generate Android project (keeps res/ icons + splash)
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: onepostai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
